services:
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    volumes:
      - ./src/API/appsettings.Staging.json:/app/appsettings.Staging.json:ro
      - ./Uploads:/app/Uploads:rw
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
    depends_on:
      - db
    restart: always

  db:
    image: postgres:17.4-alpine3.21
    environment:
        - POSTGRES_DB=project-staging
        - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
        - "127.0.0.1:3001:5432"
    volumes:
        - db:/var/lib/postgresql/data:rw
    restart: always

volumes:
  db:
